<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyTripMate — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- Side Menu & Overlay (injected by JS) -->

<div id="page-home" style="padding-bottom:80px; display:block;">

  <!-- Header -->
  <header class="home-header">
    <button class="hamburger-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    <div class="home-search">
      <input type="text" id="homeSearchInput" placeholder="Enter your destination..." onkeydown="if(event.key==='Enter') goSearch()"/>
      <button onclick="goSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <!-- Hero -->
  <section class="home-hero">
    <div class="home-hero-silhouette"><img src="images/homepage.jpg" alt=""/></div>
    <div class="home-hero-text">
      <h2>Become a companion</h2>
      <p>or</p>
      <h2>Find a companion</h2>
    </div>
  </section>

  <!-- Recommended for You -->
  <div class="home-section">
    <div class="home-section-header">
      <span class="home-section-title">✦ Recommended for You</span>
      <span class="home-section-link" onclick="window.location.href='explore.html'">See all</span>
    </div>
    <div class="rec-scroll" id="recScroll"></div>
  </div>

  <!-- Form a Group CTA -->
  <div class="group-cta" onclick="window.location.href='create-group.html'">
    <div class="group-cta-icon">✈️</div>
    <div>
      <h3>Form a Group</h3>
      <p>Create your own trip and find companions who match your vibe.</p>
    </div>
    <i class="fa-solid fa-chevron-right" style="margin-left:auto;color:var(--text-faint);"></i>
  </div>

  <!-- Explore Destinations -->
  <div class="home-section" style="margin-bottom:20px;">
    <div class="home-section-header">
      <span class="home-section-title">Explore Destinations</span>
      <span class="home-section-link" onclick="window.location.href='explore.html'">See all</span>
    </div>
    <section class="destinations-section" style="padding:0;">
      <div class="dest-grid" id="destGrid"></div>
      <div class="scroll-dots" id="destDots"></div>
    </section>
  </div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="bottom-nav-item active" onclick="window.location.href='home.html'"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='create-group.html'"><i class="fa-solid fa-plus"></i><span>Post</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='explore.html'"><i class="fa-solid fa-globe"></i><span>Explore</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='messages.html'"><i class="fa-solid fa-message"></i><span>Chat</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></button>
</nav>

<script src="js/data.js"></script>
<script src="js/sidemenu.js"></script>
<script>
  // Theme
  const saved = localStorage.getItem('mtm-theme')||'dark';
  document.documentElement.setAttribute('data-theme', saved);

  // Inject side menu
  injectSideMenu();

  function toggleMenu(){document.getElementById('sideMenu').classList.toggle('open');document.getElementById('menuOverlay').classList.toggle('active');}
  function closeMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('menuOverlay').classList.remove('active');}
  function toggleTheme(){const h=document.documentElement,isL=h.getAttribute('data-theme')==='light';h.setAttribute('data-theme',isL?'dark':'light');localStorage.setItem('mtm-theme',isL?'dark':'light');const t=document.getElementById('themeToggle');if(t)t.checked=!isL;}

  function goSearch() {
    const q = document.getElementById('homeSearchInput').value.trim();
    if(q) sessionStorage.setItem('mtm_search', q);
    window.location.href = 'explore.html';
  }

  // Render recommended trips
  const recs = getRecommendedTrips(6);
  document.getElementById('recScroll').innerHTML = recs.map((t,i) => `
    <div class="rec-card" onclick="openDetail(${t.id})">
      <img src="${t.image}" alt="${t.dest}" loading="lazy"/>
      <div class="rc-overlay">
        <div class="rc-num">${i+1}</div>
        <div class="rc-title">${t.dest}</div>
        <div class="rc-sub">${t.country} · ${t.spotsFilled}/${t.spotsTotal} spots</div>
      </div>
    </div>`).join('');

  // Render destination cards
  const destGrid = document.getElementById('destGrid');
  const dotsEl   = document.getElementById('destDots');
  destGrid.innerHTML = destinations.map(d => `
    <div class="dest-card" onclick="goToDestination('${d.city}')">
      <div class="dest-img-wrap">
        <img src="${d.image}" alt="${d.name}" loading="lazy"/>
        <div class="dest-overlay"><span class="dest-name">${d.name}</span></div>
        <button class="dest-arrow" onclick="event.stopPropagation();goToDestination('${d.city}')"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <p class="dest-desc">${d.desc}</p>
    </div>`).join('');

  dotsEl.innerHTML = destinations.map((_,i)=>`<div class="scroll-dot ${i===0?'active':''}" onclick="scrollToCard(${i})"></div>`).join('');

  // Scroll dots
  destGrid.addEventListener('scroll',()=>{
    const w = destGrid.querySelector('.dest-card').offsetWidth + 14;
    const idx = Math.round(destGrid.scrollLeft/w);
    document.querySelectorAll('.scroll-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
  });
  function scrollToCard(i){const w=destGrid.querySelector('.dest-card').offsetWidth+14;destGrid.scrollTo({left:i*w,behavior:'smooth'});}

  function goToDestination(city) {
    sessionStorage.setItem('mtm_search', city);
    window.location.href = 'explore.html';
  }
</script>
</body>
</html>

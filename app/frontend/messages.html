<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyTripMate — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div style="padding-bottom:80px;">

  <header class="search-header">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h1 style="font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;">Messages</h1>
      <button onclick="window.location.href='explore.html'" style="background:var(--purple);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-plus"></i></button>
    </div>
    <div class="search-bar-wrap" style="margin-top:12px;">
      <input type="text" id="msgSearch" placeholder="Search messages..." oninput="filterMessages(this.value)"/>
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <div class="messages-list" id="messagesList"></div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="window.location.href='home.html'"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='create-group.html'"><i class="fa-solid fa-plus"></i><span>Post</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='explore.html'"><i class="fa-solid fa-globe"></i><span>Explore</span></button>
  <button class="bottom-nav-item active"><i class="fa-solid fa-message"></i><span>Chat</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></button>
</nav>

<script src="js/data.js"></script>
<script>
  const saved = localStorage.getItem('mtm-theme')||'dark';
  document.documentElement.setAttribute('data-theme', saved);

  // Get joined trips
  const joinedIds = JSON.parse(sessionStorage.getItem('mtm_joined')||'[]');
  const joinedTrips = trips.filter(t => joinedIds.includes(t.id));

  // Mock extra groups to make it feel populated
  const mockGroups = [
    { id:99, dest:'BALI', handle:'@zen_wanderer', initials:'ZW', bio:'Yoga, rice fields & sunsets 🌅', preview:'Next meetup at Ubud Palace at 9am 🙏', time:'2m ago', unread:3, online:true },
    { id:98, dest:'TOKYO', handle:'@neon_nomad', initials:'NN', bio:'Anime & ramen 🍜', preview:'Anyone up for Shibuya crossing tonight?', time:'1h ago', unread:1, online:true },
  ];

  const allGroups = [
    ...joinedTrips.map(t=>({
      id:t.id, dest:t.dest, handle:t.handle, initials:t.initials, bio:t.bio,
      preview:`Welcome to the ${t.dest} group! 🎉`, time:'Just now', unread:2, online:false
    })),
    ...mockGroups
  ];

  function renderMessages(list) {
    const el = document.getElementById('messagesList');
    if(!list.length){
      el.innerHTML=`<div class="empty-state"><i class="fa-solid fa-comments"></i><h3>No messages yet</h3><p>Join a trip group to start chatting with fellow travellers!</p><button onclick="window.location.href='explore.html'" style="margin-top:16px;padding:12px 24px;background:var(--purple);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;">Explore Trips</button></div>`;
      return;
    }
    el.innerHTML = list.map(g=>`
      <div class="msg-item" onclick="openChat(${g.id})">
        <div class="msg-avatar-wrap">
          <div class="msg-avatar">${g.initials}</div>
          ${g.online?'<div class="msg-online"></div>':''}
        </div>
        <div class="msg-content">
          <div class="msg-name">${g.dest} Group</div>
          <div class="msg-preview">${g.preview}</div>
        </div>
        <div class="msg-meta">
          <span class="msg-time">${g.time}</span>
          ${g.unread?`<div class="msg-badge">${g.unread}</div>`:''}
        </div>
      </div>`).join('');
  }

  function filterMessages(q) {
    const filtered = allGroups.filter(g=>g.dest.toLowerCase().includes(q.toLowerCase())||g.preview.toLowerCase().includes(q.toLowerCase()));
    renderMessages(filtered);
  }

  function openChat(id) {
    sessionStorage.setItem('mtm_trip', id);
    window.location.href = 'chat.html';
  }

  renderMessages(allGroups);
</script>
</body>
</html>
